name: Main Workflow
on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  RunTestSuite:
    name: 1. Run Test Suite
    if: >
      ${{
        !(
          github.event_name == 'push' &&
          startsWith(github.event.head_commit.message, '[skip ci]')
        ) &&
        !(
          github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.title, '[skip ci]')
        )
      }}
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: npm run test:ci

      - name: Report Coverage
        if: (!cancelled())
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Publish JUnit Test Report
        if: (!cancelled()) && (success() || failure())
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit.xml
          check_name: 'Vitest JUnit'

  AlgorithmMatrix:
    name: 2. Build Apps
    needs: RunTestSuite
    strategy:
      fail-fast: false
      matrix:
        algorithm: [ syria_north_west, syria ]
        include:
          - algorithm: syria_north_west
            algorithmId: nws
            saltFilePath: ${{ vars.SALT_NWS }}
          - algorithm: syria
            algorithmId: syr
            saltFilePath: ${{ vars.SALT_SYR }}
    uses: "./.github/workflows/build.yml"
    with:
      algorithm: ${{ matrix.algorithm }}
      algorithmId: ${{ matrix.algorithmId }}
      saltFilePath: ${{ matrix.saltFilePath }}
    secrets: inherit

  CreateDraftRelease:
    name: 3. Create Draft GitHub Release
    needs: AlgorithmMatrix
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
